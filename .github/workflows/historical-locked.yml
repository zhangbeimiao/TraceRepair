name: Historical Locked Evidence (Frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-locked-v1.1.3-evidence
  cancel-in-progress: false

jobs:
  verify-frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out frozen repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install TraceRepair
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The one-shot locked evaluation completed in workflow run 39584933038.
      # This workflow intentionally has no provider credentials and cannot rerun it.
      - name: Verify published one-shot evidence
        run: python scripts/verify_benchmark_evidence.py
