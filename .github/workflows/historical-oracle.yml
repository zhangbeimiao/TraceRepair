name: Historical Oracle Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-oracle.yml"
      - "evaluation/benchmarks/historical-python-v1.1.0.json"
      - "evaluation/requirements-historical-v1.1.txt"
      - "evaluation/tasks/*.json"
      - "scripts/prepare_historical_benchmark.py"
      - "scripts/run_benchmark.py"
      - "src/tracerepair/oracle_validation.py"

permissions:
  contents: read

concurrency:
  group: historical-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            evaluation/requirements-historical-v1.1.txt

      - name: Install isolated benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r evaluation/requirements-historical-v1.1.txt

      - name: Download and verify pinned source archives
        run: python scripts/prepare_historical_benchmark.py --download

      - name: Run all five oracle checks without provider access
        env:
          DASHSCOPE_API_KEY: ""
          TRACEREPAIR_BAILIAN_BASE_URL: ""
        run: |
          mkdir -p .tmp tmp
          python scripts/run_benchmark.py \
            --manifest evaluation/benchmarks/historical-python-v1.1.0.json \
            --dry-run
