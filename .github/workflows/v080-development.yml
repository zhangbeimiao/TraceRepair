name: TraceRepair v0.8 Development Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracerepair-v080-development
  cancel-in-progress: false

jobs:
  development-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            evaluation/requirements-historical-v1.1.txt

      - name: Install isolated development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r evaluation/requirements-historical-v1.1.txt

      - name: Download and verify pinned development archives
        run: python scripts/prepare_historical_benchmark.py --download

      - name: Require provider credentials without printing them
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TRACEREPAIR_BAILIAN_BASE_URL: ${{ secrets.TRACEREPAIR_BAILIAN_BASE_URL }}
        run: |
          test -n "$DASHSCOPE_API_KEY"
          test -n "$TRACEREPAIR_BAILIAN_BASE_URL"

      - name: Verify deterministic prompt security evidence
        run: python scripts/evaluate_prompt_security.py --verify

      - name: Probe native Function Calling
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TRACEREPAIR_BAILIAN_BASE_URL: ${{ secrets.TRACEREPAIR_BAILIAN_BASE_URL }}
          TRACEREPAIR_BAILIAN_MODEL: qwen3.8-flash
        run: python scripts/function_calling_probe.py

      - name: Run v0.8.0-dev1.1 known development tasks only
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TRACEREPAIR_BAILIAN_BASE_URL: ${{ secrets.TRACEREPAIR_BAILIAN_BASE_URL }}
          TRACEREPAIR_BAILIAN_MODEL: qwen3.8-flash
        run: |
          mkdir -p .tmp tmp data
          python scripts/run_benchmark.py \
            --manifest evaluation/benchmarks/function-calling-v0.8.0-dev1.1.json \
            --split development

      - name: Compare custom JSON and native Function Calling
        run: python scripts/compare_planner_protocols.py

      - name: Evaluate semantic hybrid retrieval on development tasks
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TRACEREPAIR_BAILIAN_BASE_URL: ${{ secrets.TRACEREPAIR_BAILIAN_BASE_URL }}
        run: python scripts/evaluate_retrieval.py --embedding bailian

      - name: Enforce the semantic retrieval activation gate
        run: python scripts/evaluate_retrieval_gate.py

      - name: Upload complete development evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tracerepair-v080-development-${{ github.run_id }}
          path: |
            evaluation/results/function-calling-v0.8.0-dev1.1/
            evaluation/results/code-retrieval-v0.8.0-dev2/
            data/model-agent.sqlite3
            data/retrieval/
          if-no-files-found: ignore
          retention-days: 30
