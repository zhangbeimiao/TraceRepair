[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracerepair"
version = "0.6.0"
description = "Bounded, traceable, and test-gated code-repair agent"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/eventrelay", "src/tracerepair"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "eventrelay_tests", "evaluation/oracles"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
